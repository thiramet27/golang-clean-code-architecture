# Behind Cloudflare Tunnel the real client IP is in CF-Connecting-IP (nginx only listens on localhost,
# so the header can't be spoofed by clients connecting directly).
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Login/register run bcrypt (CPU-heavy) and are brute-force targets: 10 per minute per IP, burst 5.
# Excess requests are rejected here and never reach Python.
limit_req_zone $client_ip zone=auth:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ ^/api/v1/users/(login|register)$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://api:3000;
    }

    # API, Swagger UI and the OpenAPI document go to FastAPI
    location ~ ^/(api/|swagger|openapi\.json) {
        proxy_pass http://api:3000;
    }

    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"trace_id":"rate-limited","message":"too many attempts, please wait a minute","request_id":"$request_id"}';
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes (/login, /data, ...) all serve the SPA
    location / {
        try_files $uri /index.html;
    }
}
