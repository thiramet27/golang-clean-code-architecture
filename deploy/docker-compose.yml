# Production-style stack: Postgres + API + nginx (frontend and /api proxy).
# Only nginx is published, on localhost, for a reverse proxy / Cloudflare Tunnel in front.
#
#   cp deploy/.env.example deploy/.env   # fill in the secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# Public URL (optional): cloudflared tunnel create <name>, tunnel route dns <name> <host>,
# copy the credentials JSON to deploy/cloudflared/credentials.json, set TUNNEL_ID and COMPOSE_PROFILES=tunnel.
name: clean-api

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: clean_api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: clean_api
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clean_api -d clean_api"]
      interval: 3s
      retries: 20

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOAPP_ENV: production
      GOAPP_NAME: PYTHON CLEAN API
      GOAPP_POSTGRES_DB_HOST: db
      GOAPP_POSTGRES_DB_USER: clean_api
      GOAPP_POSTGRES_DB_NAME: clean_api
      GOAPP_POSTGRES_DB_PASSWORD: ${POSTGRES_PASSWORD}
      GOAPP_SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      GOAPP_MONGODB_DB_ATLAS_URI: ${MONGODB_URI:-}
      GOAPP_MONGODB_DB_NAME: ${MONGODB_DB_NAME:-clean_api}
      GOAPP_CORS_ORIGINS: '["${PUBLIC_URL:-http://localhost:8700}"]'
      GOAPP_WORKERS: ${API_WORKERS:-4}
    healthcheck:
      # liveness only: restarting the API would not fix a database outage
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/v1/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:${WEB_PORT:-8700}:80"

  # Public HTTPS through a Cloudflare Tunnel (enable with COMPOSE_PROFILES=tunnel).
  # No inbound port is opened: cloudflared connects out to Cloudflare and forwards to nginx.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on: [web]
    command: >-
      tunnel --no-autoupdate run
      --credentials-file /etc/cloudflared/credentials.json
      --url http://web:80
      ${TUNNEL_ID:-}
    volumes:
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro

volumes:
  pgdata:
