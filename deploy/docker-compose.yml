# Production-style stack: Postgres + API + nginx (frontend and /api proxy).
# Only nginx is published, on localhost, for a reverse proxy / Cloudflare Tunnel in front.
#
#   cp deploy/.env.example deploy/.env   # fill in the secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: clean-api

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: clean_api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: clean_api
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clean_api -d clean_api"]
      interval: 3s
      retries: 20

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOAPP_ENV: production
      GOAPP_NAME: PYTHON CLEAN API
      GOAPP_POSTGRES_DB_HOST: db
      GOAPP_POSTGRES_DB_USER: clean_api
      GOAPP_POSTGRES_DB_NAME: clean_api
      GOAPP_POSTGRES_DB_PASSWORD: ${POSTGRES_PASSWORD}
      GOAPP_SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      GOAPP_MONGODB_DB_ATLAS_URI: ${MONGODB_URI:-}
      GOAPP_MONGODB_DB_NAME: ${MONGODB_DB_NAME:-clean_api}
      GOAPP_CORS_ORIGINS: '["${PUBLIC_URL:-http://localhost:8700}"]'

  web:
    build: ../frontend
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:${WEB_PORT:-8700}:80"

volumes:
  pgdata:
